<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a14" />
      <stop offset="40%" stop-color="#0a2e23" />
      <stop offset="80%" stop-color="#0d3b2e" />
      <stop offset="100%" stop-color="#05140f" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e40" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#062d22" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-2deg); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes waveLoop {
        0% { transform: translateX(0); }
        100% { transform: translateX(-600px); }
      }
      @keyframes shineSweep {
        0% { transform: translateX(-300px) skewX(-20deg); }
        100% { transform: translateX(1300px) skewX(-20deg); }
      }

      .pulse-circle-1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .pulse-circle-2 {
        transform-origin: 1050px 320px;
        animation: pulseGlow 9s ease-in-out infinite alternate;
      }
      .floating-badge-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-badge-2 {
        animation: floatReverse 6.5s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 8 12;
        animation: flowDash 3s linear infinite;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .text-pill {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glow Orbs in Background -->
  <circle cx="200" cy="100" r="220" fill="url(#glowGrad1)" filter="url(#softGlow)" class="pulse-circle-1" />
  <circle cx="1050" cy="320" r="260" fill="url(#glowGrad2)" filter="url(#softGlow)" class="pulse-circle-2" />

  <!-- Geometric Grid Pattern Lines (Subtle) -->
  <g stroke="#10b981" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Circular Energy & Flow Waves (Behind Text) -->
  <g fill="none" opacity="0.35">
    <path d="M -50,340 C 250,280 450,390 750,330 C 1000,280 1150,360 1300,320" stroke="#34d399" stroke-width="2.5" class="stream-line" />
    <path d="M -50,370 C 200,320 500,430 850,350 C 1050,310 1180,390 1300,360" stroke="#059669" stroke-width="1.8" class="stream-line" style="animation-duration: 4.5s;" />
  </g>

  <!-- Decorative Orbiting Eco Eco-Nodes (Far Right) -->
  <g class="floating-badge-1" opacity="0.85">
    <circle cx="1080" cy="110" r="32" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#glow)" />
    <!-- Leaf Icon -->
    <path d="M 1070,120 C 1066,105 1078,95 1092,98 C 1094,112 1084,124 1070,120 Z M 1073,117 C 1082,111 1087,105 1091,100" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" />
  </g>

  <g class="floating-badge-2" opacity="0.85">
    <circle cx="980" cy="220" r="24" fill="#047857" stroke="#10b981" stroke-width="1.5" />
    <!-- Recycle / Circular Arrow Icon -->
    <path d="M 974,214 L 986,214 M 983,210 L 987,214 L 983,218 M 986,226 L 974,226 M 977,222 L 973,226 L 977,230" fill="none" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(80, 52)">
    <rect width="275" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#34d399" />
    <text x="32" y="21" fill="#a7f3d0" class="text-pill">AWESOME DIRECTORY &amp; RADAR</text>
  </g>

  <!-- Main Title (Strictly Foreground, Crisp & Clear) -->
  <text x="80" y="132" fill="#ffffff" class="text-title" font-size="44">
    Environmental Sustainability
  </text>
  <text x="80" y="184" fill="url(#accentGrad)" class="text-title" font-size="44">
    &amp; Waste Reduction
  </text>

  <!-- Subtitle (Clear, readable, high contrast) -->
  <text x="80" y="232" fill="#d1fae5" class="text-subtitle" font-size="18">
    Enterprise Carbon Accounting (Scope 1–3) • Life Cycle Assessment (LCA) • Circular Economy
  </text>
  <text x="80" y="258" fill="#9ca3af" class="text-subtitle" font-size="15">
    Real-Time Grid Carbon Telemetry APIs &amp; Green Software Engineering Metrics
  </text>

  <!-- Feature Pills / Highlights (Interactive & Polished) -->
  <g transform="translate(80, 305)">
    <!-- Pill 1: Scope 1-3 & ESG -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
      <text x="20" y="26" fill="#6ee7b7" class="text-pill">📊 Scope 1–3 &amp; CSRD</text>
    </g>

    <!-- Pill 2: Open-Source LCA -->
    <g transform="translate(195, 0)">
      <rect width="185" height="42" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
      <text x="20" y="26" fill="#6ee7b7" class="text-pill">🔬 ISO Open LCA</text>
    </g>

    <!-- Pill 3: Zero-Waste & Circularity -->
    <g transform="translate(395, 0)">
      <rect width="200" height="42" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
      <text x="20" y="26" fill="#6ee7b7" class="text-pill">♻️ Circular Waste Track</text>
    </g>

    <!-- Pill 4: Green Compute -->
    <g transform="translate(610, 0)">
      <rect width="195" height="42" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
      <text x="20" y="26" fill="#6ee7b7" class="text-pill">⚡ Green Software CI/CD</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
